name: Refresh GGUF architecture lookup

# Rebuilds en/gguf-arch-min-build-lookup/ from the git history of llama.cpp and Ollama, then
# en/llama-cpp-removed-args-lookup/ from the same llama.cpp clone.
# Each page is published only when its tests pass and its tables changed (or its data is a week old).
# If the removed-args build stops (an assert about the prose no longer holds), the GGUF page is still
# published, the removed-args page stays as it is, and the run ends red so that someone looks.
on:
  schedule:
    - cron: "23 20 * * *"   # UTC 20:23 = 05:23 JST
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the tables did not change
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/gguf-arch/**"
      - ".github/llama-args/**"
      - ".github/workflows/gguf-arch-refresh.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: gguf-arch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild from upstream git history and test
        run: |
          export PAGE_MODIFIED="$(date -u +%F)"
          bash .github/gguf-arch/run.sh "$RUNNER_TEMP/gguf-arch"

      - name: Decide and copy into the site
        id: fin
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          FLAG=""
          if [ "$EVENT" = "push" ] || [ "$FORCE" = "true" ]; then FLAG="--force"; fi
          python3 -I .github/gguf-arch/finish.py "$RUNNER_TEMP/gguf-arch/out" . $FLAG >> "$GITHUB_OUTPUT"

      - name: Rebuild the removed-args lookup and test
        id: args
        continue-on-error: true
        run: |
          export PAGE_MODIFIED="$(date -u +%F)"
          bash .github/llama-args/run.sh "$RUNNER_TEMP/gguf-arch" "$RUNNER_TEMP/llama-args" .

      - name: Decide and copy the removed-args lookup into the site
        id: afin
        if: steps.args.outcome == 'success'
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          FLAG=""
          if [ "$EVENT" = "push" ] || [ "$FORCE" = "true" ]; then FLAG="--force"; fi
          python3 -I .github/llama-args/finish.py "$RUNNER_TEMP/llama-args/site/en/llama-cpp-removed-args-lookup" . $FLAG >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: push
        if: steps.fin.outputs.publish == 'true' || steps.afin.outputs.publish == 'true'
        env:
          MESSAGE: ${{ steps.fin.outputs.publish == 'true' && steps.fin.outputs.message || steps.afin.outputs.message }}
        run: |
          git config user.name "erimaki-kobo"
          git config user.email "erimaki-kobo@users.noreply.github.com"
          git add en/gguf-arch-min-build-lookup en/llama-cpp-removed-args-lookup sitemap.xml
          if git diff --cached --quiet; then echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "$MESSAGE"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Fail the run if the removed-args lookup could not be rebuilt
        if: steps.args.outcome == 'failure' || steps.afin.outcome == 'failure'
        run: |
          echo "::error::llama-cpp-removed-args-lookup was not rebuilt; the published page is unchanged. See the two removed-args steps above."
          exit 1
