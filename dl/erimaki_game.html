<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>えりまきビックリ（えりまき工房）</title>
<style>
  html, body { -webkit-touch-callout: none; margin: 0; height: 100%; background: #1f2a1a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         touch-action: manipulation; -webkit-user-select: none; user-select: none;
         -webkit-tap-highlight-color: transparent; }
  body { flex-direction: column; }
  canvas { display: block; background: #f3ead2; cursor: pointer; }
  #hint { display: none; color: #e9dfc4; font: 600 15px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
          margin-top: 18px; text-align: center; }
  @media (orientation: portrait) { #hint { display: block; } }
</style>
</head>
<body>
<canvas id="c" aria-label="えりまきビックリ：ボタン1つのタイミングゲーム。スペースキー、クリック、タップで、えりを広げます"></canvas>
<p id="hint">画面のどこをタップしても遊べます。<br>横向きにすると大きくなります</p>
<script>
(function () {
  'use strict';
  // えりまきビックリ  作者：分かり合えないとかげ（えりまき工房）
  // 1ファイル・外部読み込みなし。?seed=数字 で敵の出方を再現できます。

  var W = 960, H = 540;
  var GROUND = 430;
  var HEAD_X = 300;               // トカゲの頭の先
  var ZONE_NEAR = 40, ZONE_FAR = 150;    // 追い返せる距離（頭の先から）
  var PERF_NEAR = 70, PERF_FAR = 112;    // ピッタリの距離
  var FONT = 'system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif';
  var COL = { body: '#7A8F4A', bodyDark: '#5E7036', frill: '#E8873A', frillEdge: '#C8452E',
              ink: '#2b2a24', sand: '#f3ead2', sand2: '#e6d7b0', zone: 'rgba(232,135,58,0.22)',
              zone2: 'rgba(200,69,46,0.30)', sky: '#f7f0dc' };

  // ---- 乱数（seed で再現できる） ----
  var params = new URLSearchParams(location.search);
  var seedParam = params.get('seed');
  var baseSeed = (seedParam !== null && /^\d+$/.test(seedParam)) ? (parseInt(seedParam, 10) >>> 0) : ((Math.random() * 4294967296) >>> 0);
  var rngState = baseSeed;
  function rand() { // mulberry32
    rngState = (rngState + 0x6D2B79F5) >>> 0;
    var t = rngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ---- 保存（使えなくても動く） ----
  var BEST_KEY = 'erimaki_bikkuri_best';
  var MUTE_KEY = 'erimaki_bikkuri_mute';
  function load(k, d) { try { var v = window.localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { window.localStorage.setItem(k, String(v)); } catch (e) { /* 保存できなくても続ける */ } }
  var best = parseInt(load(BEST_KEY, '0'), 10) || 0;
  var muted = load(MUTE_KEY, '0') === '1';

  // ---- 音（Web Audio で合成。小さめ） ----
  var ac = null, master = null;
  function wake() {
    // 止まっている（suspended）・中断された（interrupted、iPhoneで他のアプリに移ったあと）ときは起こす
    if (ac && ac.state !== 'running') { try { var p = ac.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  }
  function audioInit() {
    // iPhone・iPadのマナーモード（消音スイッチ）でも鳴るようにする（Safari 17以降）
    try { if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch (e) {}
    if (ac) { wake(); return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.4;
      master.connect(ac.destination);
      // 無音を一度鳴らして、スマホの音の鍵を開ける
      var b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
      s.buffer = b; s.connect(ac.destination); s.start(0);
      wake();
    } catch (e) { ac = null; }
  }
  function tone(freq, dur, type, slideTo, vol, delay) {
    if (!ac || muted) return;
    wake();
    try {
      var t0 = ac.currentTime + (delay || 0);
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.6, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  var sfx = {
    flare: function () { tone(220, 0.12, 'triangle', 520, 0.5); },
    scare: function (perfect) { tone(660, 0.08, 'square', 990, 0.35); tone(990, 0.12, 'square', perfect ? 1480 : 1180, 0.3, 0.07); },
    whiff: function () { tone(300, 0.15, 'sawtooth', 160, 0.25); },
    hit: function () { tone(180, 0.25, 'square', 70, 0.5); },
    over: function () { tone(440, 0.18, 'triangle', 330, 0.45); tone(330, 0.18, 'triangle', 247, 0.45, 0.2); tone(247, 0.35, 'triangle', 165, 0.45, 0.4); }
  };

  // ---- 画面 ----
  var cv = document.getElementById('c');
  var cx = cv.getContext('2d');
  var scale = 1;
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var cssW = Math.min(vw, vh * W / H);
    if (vh > vw) cssW = Math.min(cssW, (vh - 60) * W / H);
    var cssH = cssW * H / W;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.style.width = cssW + 'px';
    cv.style.height = cssH + 'px';
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    scale = cv.width / W;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- ゲームの状態 ----
  var ENEMY_TYPES = [
    { kind: 'snake', speed: 0.9, name: 'ヘビ' },
    { kind: 'bird', speed: 1.2, name: 'トリ' },
    { kind: 'fox', speed: 1.0, name: 'キツネ' }
  ];
  var g = {
    state: 'title', score: 0, lives: 3, time: 0, enemies: [], pops: [],
    flare: 0, tired: 0, nextSpawn: 0, overAt: 0, newBest: false, shake: 0,
    scared: 0, perfect: 0, hits: 0, whiffs: 0, titleT: 0, spawned: [], paused: false
  };

  function startGame() {
    rngState = (seedParam !== null) ? baseSeed : ((Math.random() * 4294967296) >>> 0);
    g.paused = false;
    g.state = 'play'; g.score = 0; g.lives = 3; g.time = 0; g.enemies = []; g.pops = [];
    g.flare = 0; g.tired = 0; g.nextSpawn = 0.8; g.newBest = false; g.shake = 0;
    g.scared = 0; g.perfect = 0; g.hits = 0; g.whiffs = 0; g.spawned = [];
  }
  function speedNow() { return Math.min(230 + g.time * 6, 560); }
  function spawn() {
    var t = ENEMY_TYPES[Math.floor(rand() * ENEMY_TYPES.length)];
    g.spawned.push(t.kind);
    g.enemies.push({ kind: t.kind, x: W + 60, v: speedNow() * t.speed, scared: false, vx: 0, t: 0, bob: rand() * 6.28 });
    var k = Math.max(0.5, 1 - g.time / 100);
    g.nextSpawn = g.time + (0.95 + rand() * 0.9) * k + 0.25;
  }

  // 押しても音が動き出さない画面（アプリの中の表示など）なら、案内を出す
  var soundBlocked = false, soundChecked = false;
  function checkSound() {
    if (soundChecked || muted) return;
    soundChecked = true;
    setTimeout(function () {
      soundBlocked = !ac || ac.state !== 'running';
      if (!soundBlocked) return;
      var d = document.createElement('p');
      d.id = 'ek-nosound';
      d.textContent = 'この画面では音が出ません。ブラウザ（SafariやChrome）で開くと鳴ります。';
      d.style.cssText = 'position:fixed;left:16px;right:16px;bottom:max(14px,env(safe-area-inset-bottom));margin:0 auto;max-width:30rem;box-sizing:border-box;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.92);color:#2b2a24;font:600 14px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;text-align:center;z-index:20;pointer-events:none';
      document.body.appendChild(d);
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 8000);
    }, 800);
  }
  function press() {
    audioInit();
    checkSound();
    if (g.state === 'title') { startGame(); return; }
    if (g.state === 'over') { if (g.time - g.overAt >= 0.6) startGame(); return; }
    if (g.paused) { g.paused = false; return; }
    if (g.flare > 0 || g.tired > 0) return;
    g.flare = 0.35;
    sfx.flare();
    // 一番近い、まだ逃げていない敵
    var target = null;
    for (var i = 0; i < g.enemies.length; i++) {
      var e = g.enemies[i];
      if (!e.scared && (!target || e.x < target.x)) target = e;
    }
    var d = target ? target.x - HEAD_X : 9999;
    if (target && d >= ZONE_NEAR && d <= ZONE_FAR) {
      var perfect = d >= PERF_NEAR && d <= PERF_FAR;
      target.scared = true; target.vx = 0; target.t = 0;
      g.score += perfect ? 2 : 1;
      g.scared++; if (perfect) g.perfect++;
      g.pops.push({ x: target.x, y: GROUND - 175, text: perfect ? 'ピッタリ！ +2' : 'ビックリ！ +1', col: perfect ? COL.frillEdge : COL.bodyDark, t: 0 });
      sfx.scare(perfect);
    } else {
      g.tired = 0.55;
      g.whiffs++;
      g.pops.push({ x: HEAD_X + 40, y: GROUND - 150, text: (target && d > ZONE_FAR) ? 'はやい！' : 'からぶり', col: '#7b6f55', t: 0 });
      sfx.whiff();
    }
  }

  function toggleMute() {
    muted = !muted;
    save(MUTE_KEY, muted ? '1' : '0');
  }

  // 入力
  var MUTE_BTN = { x: W - 64, y: 14, w: 48, h: 40 };
  function inMute(px, py) { return px >= W - 120 && py <= 90; } // 押せる範囲は印より広め
  cv.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    ev.preventDefault();
    var r = cv.getBoundingClientRect();
    var px = (ev.clientX - r.left) / r.width * W, py = (ev.clientY - r.top) / r.height * H;
    if (inMute(px, py)) { audioInit(); toggleMute(); return; }
    press();
  });
  document.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    if (ev.target !== cv) press();
  });
  // スマホでは指を離したときに音を準備する（ブラウザの決まり）
  ['pointerup', 'touchstart', 'touchend', 'click', 'keyup'].forEach(function (t) {
    document.addEventListener(t, function () { audioInit(); }, true);
  });
  cv.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  // よそ見をしたら一時停止
  function autoPause() { if (g.state === 'play') g.paused = true; }
  window.addEventListener('blur', autoPause);
  document.addEventListener('visibilitychange', function () { if (document.hidden) autoPause(); });
  window.addEventListener('keydown', function (ev) {
    if (ev.repeat) { if (ev.code === 'Space') ev.preventDefault(); return; }
    if (ev.code === 'Space' || ev.code === 'Enter' || ev.code === 'ArrowUp') { ev.preventDefault(); press(); }
    else if (ev.code === 'KeyM') { audioInit(); toggleMute(); }
  });

  // ---- 更新 ----
  function update(dt) {
    g.time += dt;
    g.titleT += dt;
    if (g.flare > 0) g.flare = Math.max(0, g.flare - dt);
    if (g.tired > 0) g.tired = Math.max(0, g.tired - dt);
    if (g.shake > 0) g.shake = Math.max(0, g.shake - dt);
    for (var p = g.pops.length - 1; p >= 0; p--) { g.pops[p].t += dt; if (g.pops[p].t > 0.9) g.pops.splice(p, 1); }
    if (g.state !== 'play' || g.paused) return;

    if (g.time >= g.nextSpawn) spawn();
    for (var i = g.enemies.length - 1; i >= 0; i--) {
      var e = g.enemies[i];
      e.t += dt;
      if (e.scared) {
        if (e.t > 0.25) { e.vx = Math.min(e.vx + 2400 * dt, 900); e.x += e.vx * dt; }
        if (e.x > W + 120) g.enemies.splice(i, 1);
      } else {
        e.x -= e.v * dt;
        if (e.x <= HEAD_X) {
          g.enemies.splice(i, 1);
          g.lives--; g.hits++; g.shake = 0.3;
          g.pops.push({ x: HEAD_X, y: GROUND - 140, text: 'イタッ', col: COL.frillEdge, t: 0 });
          sfx.hit();
          if (g.lives <= 0) {
            g.state = 'over'; g.overAt = g.time;
            if (g.score > best) { best = g.score; g.newBest = true; save(BEST_KEY, best); }
            sfx.over();
          }
        }
      }
    }
  }

  // ---- 描画 ----
  function txt(s, x, y, size, color, align, weight) {
    cx.font = (weight || '700') + ' ' + size + 'px ' + FONT;
    cx.fillStyle = color; cx.textAlign = align || 'center'; cx.textBaseline = 'middle';
    cx.fillText(s, x, y);
  }
  function drawLizard(x, y, open, tired, hurt) {
    // x,y = 胴の中心（地面の上）
    cx.save();
    cx.translate(x, y);
    // しっぽ
    cx.fillStyle = COL.body;
    cx.beginPath(); cx.moveTo(-60, -6); cx.quadraticCurveTo(-130, 10, -190, 18); cx.quadraticCurveTo(-130, 18, -58, 14); cx.closePath(); cx.fill();
    // えり（首まわり）
    var fx = 46, fy = -20;
    var R = open > 0 ? 40 + 44 * open : 24;
    var a0 = open > 0 ? -Math.PI * (0.5 + 0.2 * open) : -Math.PI * 0.62;
    var a1 = open > 0 ? Math.PI * (0.5 + 0.2 * open) : Math.PI * 0.62;
    cx.save();
    cx.beginPath(); cx.rect(-400, -400, 800, 400 + 40); cx.clip();
    cx.translate(fx, fy);
    cx.beginPath(); cx.moveTo(0, 0);
    cx.arc(0, 0, R, a0 + Math.PI, a1 + Math.PI);
    cx.closePath();
    cx.fillStyle = COL.frill; cx.fill();
    cx.lineWidth = 6; cx.strokeStyle = COL.frillEdge; cx.stroke();
    if (open > 0) { // ひだ
      cx.lineWidth = 2.5; cx.strokeStyle = COL.frillEdge;
      for (var k = 1; k < 6; k++) {
        var a = a0 + Math.PI + (a1 - a0) * k / 6;
        cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(Math.cos(a) * R * 0.92, Math.sin(a) * R * 0.92); cx.stroke();
      }
    }
    cx.restore();
    // あし
    cx.fillStyle = COL.bodyDark;
    [-38, 30].forEach(function (lx) { cx.fillRect(lx - 6, 14, 12, 24); cx.fillRect(lx - 6, 32, 20, 7); });
    // 胴（横向きの楕円）
    cx.fillStyle = COL.body;
    cx.beginPath(); cx.ellipse(0, 0, 66, 30, 0, 0, Math.PI * 2); cx.fill();
    // 頭
    cx.beginPath(); cx.ellipse(70, -22, 30, 20, -0.15, 0, Math.PI * 2); cx.fill();
    // 目
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(80, -30, 9, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#111';
    if (hurt) { cx.lineWidth = 3; cx.strokeStyle = '#111'; cx.beginPath(); cx.moveTo(75, -35); cx.lineTo(85, -25); cx.moveTo(85, -35); cx.lineTo(75, -25); cx.stroke(); }
    else if (tired) { cx.fillRect(75, -31, 11, 3); }
    else { cx.beginPath(); cx.arc(83, -30, open > 0 ? 3 : 4, 0, Math.PI * 2); cx.fill(); }
    // くち
    cx.strokeStyle = COL.ink; cx.lineWidth = 2.5;
    cx.beginPath();
    if (open > 0) { cx.moveTo(84, -12); cx.lineTo(99, -18); cx.lineTo(96, -8); }
    else { cx.moveTo(86, -14); cx.lineTo(98, -17); }
    cx.stroke();
    cx.restore();
  }
  function drawEnemy(e) {
    cx.save();
    var y = GROUND;
    cx.translate(e.x, 0);
    if (e.scared) cx.scale(-1, 1);
    var b = Math.sin(e.t * 12 + e.bob);
    if (e.kind === 'snake') {
      cx.strokeStyle = '#6b5b8a'; cx.lineWidth = 16; cx.lineCap = 'round'; cx.lineJoin = 'round';
      cx.beginPath();
      for (var i = 0; i <= 6; i++) { var sx = i * 18, sy = y - 12 + Math.sin(e.t * 10 + i * 1.1) * 7; if (i === 0) cx.moveTo(sx, sy - 10); else cx.lineTo(sx, sy); }
      cx.stroke();
      cx.fillStyle = '#6b5b8a'; cx.beginPath(); cx.ellipse(-4, y - 26, 16, 12, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(-8, y - 30, 4, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#111'; cx.beginPath(); cx.arc(-9, y - 30, 2, 0, Math.PI * 2); cx.fill();
      cx.strokeStyle = COL.frillEdge; cx.lineWidth = 2; cx.lineCap = 'butt';
      cx.beginPath(); cx.moveTo(-20, y - 24); cx.lineTo(-30, y - 24); cx.lineTo(-34, y - 28); cx.moveTo(-30, y - 24); cx.lineTo(-34, y - 20); cx.stroke();
    } else if (e.kind === 'bird') {
      var by = y - 70 + b * 6;
      cx.fillStyle = '#3d5a80';
      cx.beginPath(); cx.moveTo(-28, by); cx.lineTo(30, by - 16); cx.lineTo(36, by + 12); cx.closePath(); cx.fill();
      cx.fillStyle = '#2c4363';
      cx.beginPath(); cx.moveTo(0, by - 6); cx.lineTo(22, by - 6); cx.lineTo(16, by - 38 * (0.5 + 0.5 * b)); cx.closePath(); cx.fill();
      cx.fillStyle = '#e0b040'; cx.beginPath(); cx.moveTo(-28, by - 2); cx.lineTo(-42, by + 2); cx.lineTo(-28, by + 6); cx.closePath(); cx.fill();
      cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(-16, by - 2, 4, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#111'; cx.beginPath(); cx.arc(-17, by - 2, 2, 0, Math.PI * 2); cx.fill();
      // 地面の影（距離の目安）
      cx.fillStyle = 'rgba(0,0,0,0.12)'; cx.beginPath(); cx.ellipse(0, y + 4, 24, 5, 0, 0, Math.PI * 2); cx.fill();
    } else {
      var fy = y - 30 + Math.abs(b) * -4;
      cx.fillStyle = '#9a7b5f';
      cx.beginPath(); cx.ellipse(28, fy, 34, 18, 0, 0, Math.PI * 2); cx.fill();
      cx.beginPath(); cx.moveTo(60, fy - 6); cx.quadraticCurveTo(96, fy - 30, 92, fy + 2); cx.closePath(); cx.fill();
      cx.beginPath(); cx.moveTo(-22, fy - 2); cx.lineTo(4, fy - 22); cx.lineTo(10, fy + 8); cx.closePath(); cx.fill();
      cx.beginPath(); cx.moveTo(-2, fy - 16); cx.lineTo(2, fy - 34); cx.lineTo(10, fy - 14); cx.closePath(); cx.fill();
      cx.fillStyle = '#111'; cx.beginPath(); cx.arc(-21, fy - 1, 3, 0, Math.PI * 2); cx.fill();
      cx.beginPath(); cx.arc(-4, fy - 8, 2.5, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#7d634c';
      cx.fillRect(10, fy + 12, 7, 18 + b * 3); cx.fillRect(40, fy + 12, 7, 18 - b * 3);
    }
    if (e.scared) { cx.scale(-1, 1); txt('！', 0, e.kind === 'bird' ? y - 118 : y - 80, 36, COL.frillEdge); }
    cx.restore();
  }
  function heart(x, y, on) {
    cx.save(); cx.translate(x, y);
    cx.fillStyle = on ? COL.frillEdge : 'rgba(0,0,0,0.15)';
    cx.beginPath(); cx.moveTo(0, 6);
    cx.bezierCurveTo(-14, -4, -8, -16, 0, -8);
    cx.bezierCurveTo(8, -16, 14, -4, 0, 6);
    cx.fill(); cx.restore();
  }
  function drawMuteBtn() {
    var b = MUTE_BTN;
    cx.fillStyle = 'rgba(255,255,255,0.7)'; cx.fillRect(b.x, b.y, b.w, b.h);
    cx.strokeStyle = COL.ink; cx.lineWidth = 2; cx.strokeRect(b.x, b.y, b.w, b.h);
    var x = b.x + 10, y = b.y + b.h / 2;
    cx.fillStyle = COL.ink;
    cx.beginPath(); cx.moveTo(x, y - 6); cx.lineTo(x + 7, y - 6); cx.lineTo(x + 15, y - 13); cx.lineTo(x + 15, y + 13); cx.lineTo(x + 7, y + 6); cx.lineTo(x, y + 6); cx.closePath(); cx.fill();
    cx.lineWidth = 2.5;
    if (muted) { cx.beginPath(); cx.moveTo(x + 20, y - 7); cx.lineTo(x + 30, y + 7); cx.moveTo(x + 30, y - 7); cx.lineTo(x + 20, y + 7); cx.stroke(); }
    else { cx.beginPath(); cx.arc(x + 17, y, 7, -0.9, 0.9); cx.stroke(); cx.beginPath(); cx.arc(x + 17, y, 13, -0.9, 0.9); cx.stroke(); }
  }
  function drawScene() {
    // 空と地面
    cx.fillStyle = COL.sky; cx.fillRect(0, 0, W, H);
    cx.fillStyle = '#efe3c2';
    cx.beginPath(); cx.arc(880, 150, 40, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = COL.sand2; cx.fillRect(0, GROUND, W, H - GROUND);
    cx.fillStyle = '#d8c693';
    for (var i = 0; i < 12; i++) cx.fillRect((i * 97 + 30) % W, GROUND + 30 + (i % 3) * 22, 18, 4);
    // 追い返せる距離の目印
    cx.fillStyle = COL.zone; cx.fillRect(HEAD_X + ZONE_NEAR, GROUND, ZONE_FAR - ZONE_NEAR, 26);
    cx.fillStyle = COL.zone2; cx.fillRect(HEAD_X + PERF_NEAR, GROUND, PERF_FAR - PERF_NEAR, 26);
    cx.strokeStyle = COL.ink; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(0, GROUND); cx.lineTo(W, GROUND); cx.stroke();
  }
  function draw() {
    cx.setTransform(scale, 0, 0, scale, 0, 0);
    var sh = g.shake > 0 ? (Math.sin(g.time * 90) * 6 * g.shake / 0.3) : 0;
    cx.save(); cx.translate(sh, 0);
    drawScene();
    var open = 0;
    if (g.state === 'title') { var ph = g.titleT % 2.4; open = ph < 0.5 ? Math.sin(ph / 0.5 * Math.PI) : 0; }
    else if (g.flare > 0) { var f = 1 - g.flare / 0.35; open = f < 0.25 ? f / 0.25 : 1 - (f - 0.25) * 0.4; }
    drawLizard(212, GROUND - 40, open, g.tired > 0 && g.state === 'play', g.state === 'over');
    for (var i = 0; i < g.enemies.length; i++) drawEnemy(g.enemies[i]);
    for (var p = 0; p < g.pops.length; p++) {
      var pp = g.pops[p];
      cx.globalAlpha = Math.max(0, 1 - pp.t / 0.9);
      txt(pp.text, pp.x, pp.y - pp.t * 40, 28, pp.col);
      cx.globalAlpha = 1;
    }
    cx.restore();

    drawMuteBtn();
    if (g.state === 'play') {
      txt('スコア ' + g.score, 24, 34, 30, COL.ink, 'left');
      for (var h = 0; h < 3; h++) heart(40 + h * 34, 76, h < g.lives);
      txt('ベスト ' + best, W - 84, 34, 22, COL.ink, 'right', '600');
      if (g.scared < 2 && g.time < 12) { // 最初だけ「ここ！」
        var zx = HEAD_X + (PERF_NEAR + PERF_FAR) / 2;
        cx.globalAlpha = 0.6 + 0.4 * Math.sin(g.time * 8);
        txt('ここ！', zx, GROUND + 58, 22, COL.frillEdge);
        cx.fillStyle = COL.frillEdge; cx.beginPath(); cx.moveTo(zx - 9, GROUND + 42); cx.lineTo(zx + 9, GROUND + 42); cx.lineTo(zx, GROUND + 30); cx.closePath(); cx.fill();
        cx.globalAlpha = 1;
      }
      if (g.paused) {
        cx.fillStyle = 'rgba(243,234,210,0.9)'; cx.fillRect(230, 150, 500, 130);
        txt('一時停止中', W / 2, 192, 40, COL.ink, 'center', '900');
        txt('スペース ／ クリック ／ タップ でつづける', W / 2, 245, 22, COL.bodyDark);
      }
    } else if (g.state === 'title') {
      cx.fillStyle = 'rgba(243,234,210,0.85)'; cx.fillRect(100, 60, 760, 220);
      txt('えりまきビックリ', W / 2, 115, 64, COL.frillEdge, 'center', '900');
      txt('近づく天敵が 地面の色の帯に来たら、えりを広げて追い返そう', W / 2, 180, 23, COL.ink, 'center', '600');
      txt('スペース ／ クリック ／ タップ ではじめる', W / 2, 228, 26, COL.bodyDark);
      if (best > 0) txt('ベスト ' + best, W / 2, 262, 20, COL.ink, 'center', '600');
    } else if (g.state === 'over') {
      cx.fillStyle = 'rgba(243,234,210,0.9)'; cx.fillRect(180, 60, 600, 256);
      txt('おしまい', W / 2, 110, 54, COL.ink, 'center', '900');
      txt('スコア ' + g.score + (g.newBest ? '　ベスト更新！' : ''), W / 2, 172, 34, g.newBest ? COL.frillEdge : COL.ink);
      txt('ベスト ' + best + '　／　ピッタリ ' + g.perfect + '回', W / 2, 216, 22, COL.ink, 'center', '600');
      if (g.time - g.overAt >= 0.6) txt('もう一回：スペース ／ クリック ／ タップ', W / 2, 266, 24, COL.bodyDark);
      txt('えりまき工房　作ってほしいもの、募集しています', W / 2, 298, 16, '#7b6f55', 'center', '600');
    }
    txt('えりまき工房', W - 16, H - 18, 14, 'rgba(43,42,36,0.55)', 'right', '600');
  }

  // ---- ループ ----
  var last = performance.now();
  function frame(now) {
    var dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // テスト用（遊びには関係ありません）
  window.__erimaki = {
    get state() { return g.state; }, get score() { return g.score; }, get lives() { return g.lives; },
    get best() { return best; }, get muted() { return muted; }, get time() { return g.time; },
    get canRetry() { return g.state === 'over' && g.time - g.overAt >= 0.6; },
    get ready() { return g.flare === 0 && g.tired === 0 && !g.paused; },
    get paused() { return g.paused; },
    get stats() { return { scared: g.scared, perfect: g.perfect, hits: g.hits, whiffs: g.whiffs }; },
    nearest: function () { var t = null; g.enemies.forEach(function (e) { if (!e.scared && (!t || e.x < t.x)) t = e; }); return t ? t.x - HEAD_X : null; },
    get spawned() { return g.spawned.slice(); },
    seed: baseSeed
  };
})();
</script>
</body>
