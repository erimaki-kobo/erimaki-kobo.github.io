<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>えりまき作業タイマー（配信用）</title>
<style>
:root{
  --ink:#24301a; --muted:#5d6b4c; --line:#d5dcc6; --bg:#f6f4ec; --card:#fff;
  --green:#7A8F4A; --orange:#E8873A; --red:#C8452E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif}
body.setup{background:var(--bg);color:var(--ink)}
html.view, body.view{background:transparent !important;overflow:hidden}

/* ===== タイマー表示 ===== */
.stage{padding:12px;display:inline-block}
.panel{position:relative;display:flex;align-items:center;gap:calc(10px*var(--s));
  width:calc(580px*var(--s));height:calc(170px*var(--s));padding:calc(10px*var(--s)) calc(20px*var(--s)) calc(10px*var(--s)) calc(8px*var(--s));
  border-radius:calc(22px*var(--s));background:var(--pbg);color:var(--ptx);user-select:none;cursor:pointer}
.panel.t-toumei{background:transparent}
.panel.t-toumei .txt{text-shadow:0 0 3px #000,0 0 3px #000,0 2px 6px rgba(0,0,0,.8)}
.panel.no-liz{padding-left:calc(24px*var(--s))}
.liz{flex:0 0 auto;width:calc(150px*var(--s));height:calc(120px*var(--s));overflow:visible}
.panel.no-liz .liz{display:none}
.txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:calc(20px*var(--s));font-weight:700;color:var(--psub);white-space:nowrap}
.state .dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--acc);margin-right:.35em;vertical-align:.05em}
.panel.brk .state .dot{background:#6BA8C8}
.panel.paused .state .dot{background:#999}
.time{font-size:calc(72px*var(--s));font-weight:800;line-height:1.05;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.bar{height:calc(8px*var(--s));border-radius:99px;background:rgba(127,127,127,.35);overflow:hidden;margin:calc(4px*var(--s)) 0 calc(6px*var(--s))}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px}
.panel.brk .bar i{background:#6BA8C8}
.msg{font-size:calc(22px*var(--s));font-weight:700;white-space:nowrap;overflow:hidden}
.panel.no-count .count{display:none}

/* えりまきトカゲ */
.frill{transform-box:view-box;transform-origin:136px 74px;transform:scale(1);transition:transform .22s cubic-bezier(.3,1.8,.5,1)}
.ribs{opacity:0;transition:opacity .15s}
.liz.pop .frill{transform:scale(2.05)}
.liz.pop .ribs{opacity:1}
.liz .whole{transform-box:view-box;transform-origin:100px 110px}
.liz.pop .whole{animation:hop .5s ease-out}
.liz .mouth-open{opacity:0}
.liz.pop .mouth-open{opacity:1}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-9px)}70%{transform:translateY(0)}85%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.liz .eye-lid{transform-box:view-box;transform-origin:158px 68px;transform:scaleY(0)}
.liz.blink .eye-lid,.panel.paused .liz .eye-lid{transform:scaleY(1)}

/* ===== 設定画面 ===== */
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.lead{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:15px;margin:0 0 10px}
.f{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px 10px;align-items:center;font-size:14px}
.f label{font-weight:600}
.f input[type=text],.f input[type=number],.f select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:38px}
.f input[type=color]{width:56px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.f input[type=range]{width:100%}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{grid-column:1/-1;color:var(--muted);font-size:12px;margin:-4px 0 2px}
.prevbox{border-radius:12px;padding:8px;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-color:#cfd6c0;background-image:linear-gradient(45deg,#b9c2a6 25%,transparent 25%,transparent 75%,#b9c2a6 75%),linear-gradient(45deg,#b9c2a6 25%,transparent 25%,transparent 75%,#b9c2a6 75%);
  background-size:24px 24px;background-position:0 0,12px 12px}
.prevbox.dark{background-color:#2a2d33;background-image:linear-gradient(45deg,#353a42 25%,transparent 25%,transparent 75%,#353a42 75%),linear-gradient(45deg,#353a42 25%,transparent 25%,transparent 75%,#353a42 75%)}
.prevscale{transform-origin:center center}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,.btn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--green);background:#fff;color:#3d4d22;border-radius:9px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;min-height:38px}
button.main{background:var(--green);color:#fff}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
textarea.url{width:100%;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;resize:vertical;min-height:84px;color:var(--ink);background:#fbfbf7;word-break:break-all}
.size-note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}
.ok{color:#3d7a2a;font-weight:700;font-size:13px;min-height:1.2em;margin-top:6px}
ol.how{margin:6px 0 0;padding-left:1.3em;font-size:14px;line-height:1.75}
.foot{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.6}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}
</style>
<link rel="canonical" href="https://erimaki-kobo.github.io/play/sagyou-timer.html">
<meta property="og:url" content="https://erimaki-kobo.github.io/play/sagyou-timer.html">
</head>
<body>
<template id="tpl-panel">
  <div class="panel" title="クリック（タップ）で一時停止／再開">
    <svg class="liz" viewBox="0 0 200 140" aria-hidden="true">
      <g class="whole">
        <path d="M40 98 C20 104 8 96 6 84 C5 78 10 76 12 82 C15 90 24 94 42 88 Z" fill="#7A8F4A"/>
        <g class="frill">
          <path d="M118 74 A18 18 0 0 1 154 74 Z" fill="#E8873A" stroke="#C8452E" stroke-width="2.4" stroke-linejoin="round"/>
          <g class="ribs" stroke="#C8452E" stroke-width="1.3" stroke-linecap="round">
            <line x1="136" y1="74" x2="121" y2="64"/><line x1="136" y1="74" x2="128" y2="58"/>
            <line x1="136" y1="74" x2="136" y2="56"/><line x1="136" y1="74" x2="144" y2="58"/>
            <line x1="136" y1="74" x2="151" y2="64"/>
          </g>
        </g>
        <rect x="58" y="104" width="9" height="20" rx="4" fill="#6a7d3e"/>
        <rect x="106" y="104" width="9" height="20" rx="4" fill="#6a7d3e"/>
        <ellipse cx="90" cy="94" rx="54" ry="22" fill="#7A8F4A"/>
        <path d="M128 86 C134 78 140 74 146 72 L150 84 C142 88 136 92 130 96 Z" fill="#7A8F4A"/>
        <ellipse cx="156" cy="73" rx="22" ry="13" fill="#7A8F4A"/>
        <path class="mouth-open" d="M164 78 L178 76 L170 84 Z" fill="#C8452E"/>
        <path d="M163 78 Q170 79 177 76" stroke="#4f5f2c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <circle cx="158" cy="68" r="5" fill="#fff"/>
        <circle cx="159.5" cy="68" r="2.4" fill="#111"/>
        <ellipse class="eye-lid" cx="158" cy="68" rx="5.6" ry="5.6" fill="#6a7d3e"/>
      </g>
    </svg>
    <div class="txt">
      <div class="row1"><span class="state"><span class="dot"></span><span class="stxt">作業中</span></span><span class="count">今日 <b class="cn">0</b> 回</span></div>
      <div class="time">25:00</div>
      <div class="bar"><i></i></div>
      <div class="msg">いまは集中タイム</div>
    </div>
  </div>
</template>

<script>
"use strict";
(function(){
  var DEF = {work:25, brk:5, msg:"いまは集中タイム", bmsg:"ひと休みちゅう", size:"m", theme:"kusa",
             accent:"#E8873A", lizard:1, count:1, sound:0, vol:30, speed:1, start:1};
  var THEMES = {
    kusa:  {pbg:"rgba(36,46,22,.84)", ptx:"#ffffff", psub:"#dfe8c8", label:"草（深い緑）"},
    yoru:  {pbg:"rgba(20,22,40,.84)", ptx:"#ffffff", psub:"#c9cee9", label:"夜（紺）"},
    shiro: {pbg:"rgba(255,255,255,.92)", ptx:"#26301c", psub:"#56614a", label:"白"},
    toumei:{pbg:"transparent", ptx:"#ffffff", psub:"#ffffff", label:"板なし（文字だけ・縁取り）"}
  };
  var SIZES = {s:0.75, m:1, l:1.4};
  var MAXMSG = 24;

  function clampInt(v, lo, hi, d){ var n = parseInt(v,10); if(isNaN(n)) return d; return Math.min(hi, Math.max(lo, n)); }
  function cleanMsg(v, d){ if(v==null) return d; v = String(v).replace(/[\u0000-\u001f\u007f]/g,"").trim(); return Array.from(v).slice(0,MAXMSG).join(""); }
  function cleanColor(v, d){ return /^#[0-9a-fA-F]{6}$/.test(v||"") ? v : d; }

  function readParams(){
    var p = new URLSearchParams(location.search);
    var h = location.hash.replace(/^#/,"");
    if(h){ new URLSearchParams(h).forEach(function(v,k){ if(!p.has(k)) p.set(k,v); }); }
    return p;
  }
  function parseOpts(p){
    var o = {};
    o.work = clampInt(p.get("work"),1,180,DEF.work);
    o.brk = clampInt(p.get("brk"),1,60,DEF.brk);
    o.msg = cleanMsg(p.get("msg"),DEF.msg);
    o.bmsg = cleanMsg(p.get("bmsg"),DEF.bmsg);
    o.size = SIZES[p.get("size")] ? p.get("size") : DEF.size;
    o.theme = THEMES[p.get("theme")] ? p.get("theme") : DEF.theme;
    var a = p.get("accent"); if(a && a.charAt(0)!=="#") a = "#"+a;
    o.accent = cleanColor(a, DEF.accent);
    o.lizard = p.get("lizard")==="0" ? 0 : 1;
    o.count = p.get("count")==="0" ? 0 : 1;
    o.sound = p.get("sound")==="1" ? 1 : 0;
    o.vol = clampInt(p.get("vol"),0,100,DEF.vol);
    o.speed = clampInt(p.get("speed"),1,600,1);
    o.start = p.get("start")==="0" ? 0 : 1;
    return o;
  }

  /* ---- 保存（使えなくても動く） ---- */
  function todayKey(){ var d=new Date(); return "erimaki_timer_count_"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  var memCount = {};
  function loadCount(){ var k=todayKey(); try{ var v=localStorage.getItem(k); if(v!=null) return clampInt(v,0,9999,0); }catch(e){} return memCount[k]||0; }
  function saveCount(n){ var k=todayKey(); memCount[k]=n; try{ localStorage.setItem(k,String(n)); }catch(e){} }

  /* ---- 音（Web Audio で合成。初期は音なし） ---- */
  var actx = null;
  function chime(isWork, vol){
    try{
      if(!actx){ var AC = window.AudioContext||window.webkitAudioContext; if(!AC) return; actx = new AC(); }
      if(actx.state==="suspended") actx.resume();
      var t0 = actx.currentTime+0.02, g = Math.max(0,Math.min(1,vol/100))*0.25;
      var notes = isWork ? [659.25, 880, 1318.5] : [880, 659.25, 523.25];
      notes.forEach(function(f,i){
        var o = actx.createOscillator(), gn = actx.createGain();
        o.type = "sine"; o.frequency.value = f;
        var t = t0 + i*0.16;
        gn.gain.setValueAtTime(0.0001,t); gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,g),t+0.02); gn.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
        o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t+0.55);
      });
    }catch(e){}
  }

  /* ---- 表示部品 ---- */
  function makePanel(host){
    var node = document.getElementById("tpl-panel").content.firstElementChild.cloneNode(true);
    host.appendChild(node);
    var q = function(s){ return node.querySelector(s); };
    var el = {liz:q(".liz"), stxt:q(".stxt"), cn:q(".cn"), time:q(".time"), bar:q(".bar i"), msg:q(".msg")};
    var popTimer = null, lastMsg = null, lastFit = null;
    function fitMsg(){
      var base = parseFloat(getComputedStyle(node).getPropertyValue("--s"))*22;
      var fs = base; el.msg.style.fontSize = fs+"px";
      var guard = 0;
      while(el.msg.scrollWidth > el.msg.clientWidth+1 && fs > 10 && guard++ < 40){ fs -= 1; el.msg.style.fontSize = fs+"px"; }
    }
    var api = {
      node: node,
      apply: function(o){
        node.style.setProperty("--s", SIZES[o.size]);
        var th = THEMES[o.theme];
        node.style.setProperty("--pbg", th.pbg); node.style.setProperty("--ptx", th.ptx); node.style.setProperty("--psub", th.psub);
        node.style.setProperty("--acc", o.accent);
        node.className = "panel t-"+o.theme + (o.lizard?"":" no-liz") + (o.count?"":" no-count");
        lastMsg = null;
      },
      render: function(st){
        node.classList.toggle("brk", st.phase==="brk");
        node.classList.toggle("paused", !st.running);
        el.stxt.textContent = !st.running ? "一時停止中" : (st.phase==="work" ? "作業中" : "休憩中");
        el.cn.textContent = String(st.count);
        var sec = Math.max(0, Math.ceil(st.remain/1000));
        var mm = Math.floor(sec/60), ss = sec%60;
        el.time.textContent = mm + ":" + String(ss).padStart(2,"0");
        el.bar.style.width = (Math.min(1, Math.max(0, 1 - st.remain/st.total))*100).toFixed(2)+"%";
        var m = st.phase==="work" ? st.msg : st.bmsg;
        var key = m + "|" + node.className;
        if(key !== lastMsg){ el.msg.textContent = m; lastMsg = key; fitMsg(); }
      },
      pop: function(){
        el.liz.classList.remove("pop"); void el.liz.getBoundingClientRect(); el.liz.classList.add("pop");
        clearTimeout(popTimer); popTimer = setTimeout(function(){ el.liz.classList.remove("pop"); }, 3600);
      },
      blink: function(){ el.liz.classList.add("blink"); setTimeout(function(){ el.liz.classList.remove("blink"); }, 140); }
    };
    return api;
  }

  /* ---- タイマー本体 ---- */
  function Timer(o, onSwitch){
    this.o = o; this.onSwitch = onSwitch;
    this.phase = "work"; this.total = o.work*60000; this.remain = this.total;
    this.running = !!o.start; this.count = loadCount(); this.day = todayKey(); this.last = performance.now();
  }
  Timer.prototype.tick = function(now){
    var dt = Math.max(0, now - this.last); this.last = now;
    if(this.day !== todayKey()){ this.day = todayKey(); this.count = loadCount(); }
    if(!this.running) return;
    this.remain -= dt * this.o.speed;
    var guard = 0;
    while(this.remain <= 0 && guard++ < 1000){
      var over = -this.remain;
      if(this.phase === "work"){ this.count += 1; saveCount(this.count); this.setPhase("brk"); }
      else { this.setPhase("work"); }
      this.remain -= over;
      if(this.onSwitch) this.onSwitch(this.phase);
    }
  };
  Timer.prototype.setPhase = function(ph){ this.phase = ph; this.total = (ph==="work"?this.o.work:this.o.brk)*60000; this.remain = this.total; };
  Timer.prototype.state = function(){ return {phase:this.phase, remain:this.remain, total:this.total, running:this.running, count:this.count, msg:this.o.msg, bmsg:this.o.bmsg}; };
  Timer.prototype.toggle = function(){ this.running = !this.running; this.last = performance.now(); };
  Timer.prototype.skip = function(){ this.setPhase(this.phase==="work"?"brk":"work"); if(this.onSwitch) this.onSwitch(this.phase); };
  Timer.prototype.restart = function(){ this.remain = this.total; };
  Timer.prototype.resetCount = function(){ this.count = 0; saveCount(0); };

  /* ===== タイマー表示モード ===== */
  function startView(p){
    document.documentElement.className = "view"; document.body.className = "view";
    var o = parseOpts(p);
    var stage = document.createElement("div"); stage.className = "stage"; document.body.appendChild(stage);
    var panel = makePanel(stage); panel.apply(o);
    var tm = new Timer(o, function(ph){ panel.pop(); if(o.sound) chime(ph==="work", o.vol); });
    function loop(){ tm.tick(performance.now()); panel.render(tm.state()); }
    loop(); setInterval(loop, 100);
    var bl = 0; setInterval(function(){ bl++; if(bl%3!==1) panel.blink(); }, 2600);
    panel.node.addEventListener("click", function(){ tm.toggle(); loop(); });
    document.addEventListener("keydown", function(e){
      var k = e.key, c = e.code;
      if(c==="Space"||k===" "||k==="Spacebar"){ e.preventDefault(); tm.toggle(); }
      else if(c==="KeyN"||k==="n"||k==="N"){ tm.skip(); }
      else if(c==="KeyR"||k==="r"||k==="R"){ tm.restart(); }
      else if(c==="Digit0"||c==="Numpad0"||k==="0"){ tm.resetCount(); }
      loop();
    });
    window.__timer = tm; window.__panel = panel;
  }

  /* ===== 設定画面モード ===== */
  function startSetup(p){
    document.body.className = "setup";
    var o = parseOpts(p);
    var themeOpts = Object.keys(THEMES).map(function(k){ return '<option value="'+k+'">'+THEMES[k].label+'</option>'; }).join("");
    var w = document.createElement("div"); w.className = "wrap";
    w.innerHTML =
      '<h1>えりまき作業タイマー</h1><div style="font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px">配信用（OBSのブラウザソース）</div>'+
      '<p class="lead">作業と休憩を交互に数えるタイマーです。切り替わりで、えりまきトカゲがえりを広げて知らせます。一時停止中は目を閉じて待ちます。下で設定を選ぶと、OBSに貼るURLができます。表示の背景は透明です。</p>'+
      '<div class="grid">'+
      '<div class="card"><h2>1. 設定</h2><div class="f">'+
        '<label for="i-work">作業（分）</label><input id="i-work" type="number" min="1" max="180" inputmode="numeric">'+
        '<label for="i-brk">休憩（分）</label><input id="i-brk" type="number" min="1" max="60" inputmode="numeric">'+
        '<label for="i-msg">作業中の一言</label><input id="i-msg" type="text" maxlength="'+MAXMSG+'">'+
        '<label for="i-bmsg">休憩中の一言</label><input id="i-bmsg" type="text" maxlength="'+MAXMSG+'">'+
        '<div class="hint">一言は'+MAXMSG+'文字まで。長いと文字が小さくなります。</div>'+
        '<label for="i-size">大きさ</label><select id="i-size"><option value="s">小</option><option value="m">中</option><option value="l">大</option></select>'+
        '<label for="i-theme">見た目</label><select id="i-theme">'+themeOpts+'</select>'+
        '<label for="i-accent">作業中の色</label><div class="inline"><input id="i-accent" type="color"><span style="font-size:12px;color:var(--muted)">印と進み具合の線の色</span></div>'+
        '<label for="i-lizard">トカゲ</label><select id="i-lizard"><option value="1">出す</option><option value="0">出さない</option></select>'+
        '<label for="i-count">今日の回数</label><select id="i-count"><option value="1">出す</option><option value="0">出さない</option></select>'+
        '<label for="i-start">始め方</label><select id="i-start"><option value="1">すぐ動き出す</option><option value="0">止まった状態で待つ</option></select>'+
        '<div class="hint">「止まった状態で待つ」にすると、配信を始めるときにクリック（またはスペース）で動き出します。</div>'+
        '<label for="i-sound">切り替わりの音</label><select id="i-sound"><option value="0">なし</option><option value="1">あり</option></select>'+
        '<label for="i-vol">音の大きさ</label><div class="inline"><input id="i-vol" type="range" min="0" max="100" step="5" style="flex:1"><span id="o-vol" style="width:3em;text-align:right;font-size:13px"></span></div>'+
      '</div></div>'+
      '<div>'+
        '<div class="card"><h2>2. 見本</h2>'+
          '<div class="prevbox" id="prevbox"><div class="prevscale" id="prevscale"></div></div>'+
          '<div class="btns"><button type="button" id="b-pop">えりまきの動きを見る</button><button type="button" id="b-sound">音を試す</button><button type="button" id="b-bg">見本の背景を切り替え</button></div>'+
          '<div class="size-note" id="sizenote"></div>'+
        '</div>'+
        '<div class="card" style="margin-top:16px"><h2>3. OBSに貼るURL</h2>'+
          '<textarea class="url" id="o-url" readonly aria-label="OBSに貼るURL"></textarea>'+
          '<div class="btns"><button type="button" class="main" id="b-copy">URLをコピー</button><a class="btn" id="a-open" target="_blank" rel="noopener">このURLを開いて試す</a><button type="button" id="b-reset">今日の回数を0にする</button></div>'+
          '<div class="ok" id="o-ok" role="status"></div>'+
          '<ol class="how"><li>OBSの「ソース」で ＋ →「ブラウザ」を追加</li><li>「ローカルファイル」のチェックは<b>外したまま</b>、URL欄に上のURLを貼る</li><li>幅と高さに、見本の下に書いた数字を入れる</li><li>配信中の操作はソースを右クリック→「対話」：クリックか <kbd>Space</kbd> で一時停止／再開、<kbd>N</kbd> 次へ飛ばす、<kbd>R</kbd> 今の区切りをやり直す、<kbd>0</kbd> 今日の回数を0にする</li></ol>'+
        '</div>'+
      '</div></div>'+
      '<p class="foot">このファイル1つで動きます。インターネットにはつながりません。今日の回数はこのブラウザ（またはOBS）の中だけに保存されます。<br>作ってほしいもの（ゲーム・道具・印刷物など）があれば、えりまき工房のBOOTHショップの募集フォームへどうぞ。<br>えりまき工房</p>';
    document.body.appendChild(w);

    var $ = function(id){ return document.getElementById(id); };
    var ids = ["work","brk","msg","bmsg","size","theme","accent","lizard","count","start","sound","vol"];
    ids.forEach(function(k){ $("i-"+k).value = String(o[k]); });
    var host = $("prevscale");
    var panel = makePanel(host);
    var prevSt = {phase:"work", remain:0, total:1, running:true, count:3, msg:"", bmsg:""};

    function cur(){
      var p2 = new URLSearchParams();
      ids.forEach(function(k){ p2.set(k, $("i-"+k).value); });
      return parseOpts(p2);
    }
    function buildUrl(c){
      var base = location.href.split(/[?#]/)[0];
      var q = new URLSearchParams();
      q.set("view","1");
      ["work","brk","msg","bmsg","size","theme"].forEach(function(k){ q.set(k, String(c[k])); });
      q.set("accent", c.accent.replace("#",""));
      q.set("lizard", String(c.lizard)); q.set("count", String(c.count)); if(!c.start) q.set("start","0");
      q.set("sound", String(c.sound)); if(c.sound) q.set("vol", String(c.vol));
      return base + "?" + q.toString();
    }
    function fit(){
      var box = $("prevbox"); var avail = box.clientWidth - 16;
      var pw = host.firstElementChild.offsetWidth;
      var sc = Math.min(1, avail / pw);
      host.style.transform = "scale("+sc+")";
      box.style.height = Math.max(220, host.firstElementChild.offsetHeight*sc + 40) + "px";
    }
    function update(){
      var c = cur();
      $("o-vol").textContent = c.vol;
      $("i-vol").disabled = !c.sound;
      panel.apply(c);
      prevSt.msg = c.msg; prevSt.bmsg = c.bmsg; prevSt.total = c.work*60000; prevSt.remain = c.work*60000*0.62;
      panel.render(prevSt);
      var s = SIZES[c.size];
      $("sizenote").innerHTML = "OBSのブラウザソースの大きさの目安：<b>幅 "+Math.ceil(580*s+24)+" × 高さ "+Math.ceil(170*s+24)+"</b>（1920×1080の配信画面向け）";
      var u = buildUrl(c);
      $("o-url").value = u; $("a-open").href = u;
      fit();
    }
    ids.forEach(function(k){ $("i-"+k).addEventListener("input", update); $("i-"+k).addEventListener("change", function(){ if(k==="work"||k==="brk"){ $("i-"+k).value = String(cur()[k]); } update(); }); });
    $("b-pop").addEventListener("click", function(){ panel.pop(); });
    $("b-sound").addEventListener("click", function(){ chime(true, cur().vol || 30); });
    $("b-bg").addEventListener("click", function(){ $("prevbox").classList.toggle("dark"); });
    $("b-copy").addEventListener("click", function(){
      var t = $("o-url"), ok = $("o-ok");
      function done(){ ok.textContent = "コピーしました。OBSのURL欄に貼ってください。"; }
      function fallback(){ try{ t.focus(); t.select(); t.setSelectionRange(0, t.value.length); if(document.execCommand("copy")) done(); else ok.textContent = "上のURLを選んでコピーしてください。"; }catch(e){ ok.textContent = "上のURLを選んでコピーしてください。"; } }
      try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t.value).then(done, fallback); } else fallback(); }catch(e){ fallback(); }
    });
    $("b-reset").addEventListener("click", function(){ saveCount(0); $("o-ok").textContent = "このブラウザの今日の回数を0にしました（OBSの中の回数は別に保存されています）。"; });
    window.addEventListener("resize", fit);
    update();
    setTimeout(function(){ panel.pop(); }, 600);
    window.__setupPanel = panel;
  }

  var P = readParams();
  if(P.get("view")==="1") startView(P); else startSetup(P);
})();
</script>
<script>(function(){function add(){if(!document.body.classList.contains("setup"))return;
var d=document.createElement("div");d.id="ek-try";
d.innerHTML='<a href="../index.html">← えりまき工房</a><p><b>ここは動きを試すページです。</b>OBSで使うときは、えりまき工房のトップの「ファイルを保存」で sagyou_timer.html を保存し、保存したファイルをブラウザで開いて設定してください。このページで作ったURLは、OBSでは使えないことがあります。</p>';
document.body.insertBefore(d,document.body.firstChild);}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",add);else add();})();</script>
